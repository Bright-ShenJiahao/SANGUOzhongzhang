<title>三国：战至终章</title><style>
html,body{margin:0;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:#0c0907;font-family:Pixel12,system-ui,"PingFang SC","Noto Sans CJK SC",Pixel12,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px calc(10px + env(safe-area-inset-left));align-items:center;flex-wrap:wrap;z-index:2;pointer-events:none}
button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.55);background:rgba(20,14,30,.35);color:#fff;text-shadow:0 1px 2px #000;border-radius:7px;padding:4px 8px;touch-action:none}
button.on{background:rgba(255,216,110,.85);color:#2a2234;text-shadow:none;border-color:#ffd86e}
#wp{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top));display:flex;gap:5px;z-index:3;align-items:center}
#wp button[data-w]{width:48px;height:48px;padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wp button[data-w] img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
#wp button[data-w] img[data-weapon-icon="w_bow"]{width:32px;height:34px;object-fit:contain}
#wp button[data-w] img[data-weapon-icon="w_halberd"]{width:38px;height:32px;object-fit:contain}
#bWeapon{width:42px;height:42px;padding:0;border-radius:50%;font-size:22px;line-height:1;color:#f3d37b;border-color:rgba(224,184,99,.8);background:rgba(54,38,24,.76)}
#bWeapon:active{background:rgba(130,91,43,.92);transform:rotate(30deg)}
#bMute{min-width:40px;height:42px;padding:0 7px}
#joy{position:fixed;left:0;bottom:0;width:50%;height:70%;z-index:1;touch-action:none}
#base{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:25px;top:25px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.4)}
.big{position:fixed;z-index:3;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.5);color:#fff;text-shadow:0 1px 3px #000}
.big:active{background:rgba(255,255,255,.3)}
/* 透明按钮，贴近右下角 */
#bA{right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:72px;height:72px;background:rgba(210,60,48,.28);border-color:rgba(255,160,150,.7)}
#bA:active{background:rgba(210,60,48,.5)}
#bA::after{content:"";position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;background:conic-gradient(from -90deg,var(--charge-color,#ffe08a) 0deg var(--charge-angle,0deg),rgba(255,224,138,.12) var(--charge-angle,0deg) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#bA.charging::after{opacity:1;filter:drop-shadow(0 0 4px rgba(255,210,100,.8))}
#bA.charged::after{animation:charge-pulse .65s ease-in-out infinite alternate}
@keyframes charge-pulse{to{filter:drop-shadow(0 0 9px #8de5ff)}}
#bR{right:calc(96px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:13px}
#bSkill{display:none;right:calc(18px + env(safe-area-inset-right));bottom:calc(98px + env(safe-area-inset-bottom));width:96px;height:44px;border-radius:18px;font-size:12px;background:rgba(174,126,45,.82);border-color:rgba(255,226,151,.85)}
body.szz-summon #bSkill{display:flex}
#bCatapult{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(146px + env(safe-area-inset-bottom));width:96px;height:42px;border-radius:16px;z-index:6;
  background:rgba(96,60,26,.92);border:2px solid #c9971f;color:#f3d37b;font:700 14px "PingFang SC",Pixel12,sans-serif}
body.szz-catapult #bCatapult{display:block}
body.szz-summon #bSkill:disabled{filter:saturate(.6)}
#help{position:fixed;left:10px;bottom:8px;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none}
body.szz-rogue #top,body.szz-rogue #wp,body.szz-rogue #joy,body.szz-rogue .big,body.szz-rogue #help{display:none}
body.szz-rogue #bSkill,body.szz-rogue #bCatapult{display:none!important}
@media (max-width:600px){#wp{gap:3px}#wp button[data-w]{width:42px;height:44px}#wp button[data-w] img{width:36px;height:36px}#bWeapon{width:38px;height:38px}#bMute{min-width:36px;height:38px}}
@media (pointer:coarse){
  #wp{gap:6px} #wp button[data-w]{width:52px;height:52px;min-width:52px;padding:6px}
  #bWeapon{position:fixed;right:calc(23px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:54px;height:54px;z-index:7;font-size:14px;background:radial-gradient(circle at 30% 25%,#79613bcc,#352719e8);box-shadow:0 2px 5px #21160d88}
  #bSkill{right:calc(2px + env(safe-area-inset-right));bottom:calc(164px + env(safe-area-inset-bottom))}
  #bCatapult{right:calc(2px + env(safe-area-inset-right));bottom:calc(216px + env(safe-area-inset-bottom))}
  body.szz-catapult:not(.szz-summon) #bCatapult{bottom:calc(164px + env(safe-area-inset-bottom))}
  #bWeapon:active{transform:translateY(1px);background:#8a653b}
  #wp button.weapon-pending{outline:2px dashed #e4c779;outline-offset:1px}
  #bA,#bR,#bSkill,#bCatapult,#bWeapon{touch-action:none;-webkit-user-select:none}
}
body.szz-pro #help{display:none}
#rot{display:none;position:fixed;inset:0;z-index:2147483000;background:radial-gradient(ellipse at 50% 45%,#221a13,#0c0907);color:#e6c98a;font-family:"Songti SC","Noto Serif SC",Pixel12,serif;font-size:20px;font-weight:800;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.8;padding:0 24px}
@media (pointer:coarse){#help{display:none}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
@media (pointer:coarse) and (orientation:portrait){body.ontitle #rot{display:none}}   /* 11/11：竖屏也能看主界面（竖幅水墨），点「新的旅途/继续」进游戏后才提示横过来 */
@media (pointer:coarse){
#cloudRetry,#cloudPin{min-width:34px!important;min-height:32px!important}
#tHelp{min-width:34px!important;min-height:34px!important}
.shopBuy{min-height:34px!important;padding:0 10px!important}.shopPrice{white-space:nowrap}
#masteryPanel .mx{min-height:34px!important;padding:2px 14px!important}
.x-back{min-height:34px!important}
}
#rot small{display:block;margin-top:10px;font-size:14px;font-weight:600;color:#c9b691;line-height:1.6}

var ready=false,failed=false,p=0,el=function(i){return document.getElementById(i);},
 words=['磨刀','整军','点兵','擂鼓','出城'],wi=0,pc=function(){return Math.round(p*100)+'%';},
 line=function(){el('bootText').textContent=words[wi]+'中…… '+pc();},
 timer=setTimeout(function(){if(!ready)el('bootRefresh').hidden=false;},10000),
 tick=setInterval(function(){if(failed)return;p+=(0.9-p)*0.06;el('bootBar').style.width=(p*100)+'%';el('bootBigInk').style.clipPath='inset(0 '+(100-p*100)+'% 0 0)';if(!ready)line();},120),   // 11/13：大字「出征」跟着进度一笔一笔显出来   // 假进度：慢慢逼近九成，真正好了再写满
 say=setInterval(function(){if(failed)return;wi=(wi+1)%words.length;line();},2000);
(function(){var a=el('bootArt'),u=getComputedStyle(a).backgroundImage.replace(/^url\(["']?|["']?\)$/g,''),im=new Image();im.onload=function(){a.classList.add('on');};im.src=u;})();
function error(message){if(ready)return;failed=true;el('bootText').textContent='加载出错';el('bootRefresh').hidden=false;el('bootError').textContent=String(message||'未知错误');}
window.addEventListener('error',function(e){if(e.message)error(e.message);});
window.addEventListener('unhandledrejection',function(e){error(e.reason&&e.reason.message||e.reason);});
// 脚本跑完只算「代码好了」；等首页背景图和书法标题也下载好，title.js 再调 bootDone 揭幕（11/11 用户定：加载提示放在登录框的位置）
window.finishBoot=function(){if(failed)return;ready=true;clearTimeout(timer);};
// 11/12：「点击任意处开始」和加载结合——图好了再等主界面曲缓冲（最多 5 秒）；浏览器允许自动放音就直接揭幕，不允许就在进度条位置提示点一下，点的这一下音乐和首页一起出来
window.bootDone=function(){if(failed)return;ready=true;clearTimeout(timer);clearInterval(say);el('bootText').textContent='调弦中……';
 var t0=Date.now(),wait=setInterval(function(){var B=window.BGM_TITLE,a=B&&B.audio;if(a&&a.readyState<3&&Date.now()-t0<5000)return;clearInterval(wait);clearInterval(tick);p=1;el('bootBar').style.width='100%';el('bootBigInk').style.clipPath='inset(0 0 0 0)';
  if(B&&B.auto){reveal();return;}
  var s=el('bootSplash');el('bootText').textContent='点击任意处开始';el('bootText').className='tap';s.style.cursor='pointer';
  var go=function(e){if(e&&e.type==='keydown'&&e.key==='Escape')return;if(e){e.preventDefault();e.stopPropagation();}window.removeEventListener('keydown',go,true);s.removeEventListener('click',go);s.removeEventListener('pointerup',up);if(B&&B.start)B.start();reveal();},
   up=function(e){if(e.pointerType!=='mouse')go(e);};
  s.addEventListener('click',go);s.addEventListener('pointerup',up);window.addEventListener('keydown',go,true);},100);};
function reveal(){el('bootText').className='';el('bootText').textContent='';window.bootRevealed=true;setTimeout(function(){var s=el('bootSplash');if(!s)return;s.classList.add('out');setTimeout(function(){s.remove();},500);},250);}
if(location.protocol==='https:'&&!/[?&]debug(?:=|&|$)/.test(location.search)&&'serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
})();
// 自动更新：打开游戏、或从后台切回来时，查一下线上有没有新版本；有就在标题/整备页自动刷新（战斗中不打扰）
(function(){
var BUILD='9458b1907c18',busy=false;
if(location.protocol!=='https:'||/[?&]debug(?:=|&|$)/.test(location.search))return;
function check(){
  if(busy)return;
  if(window.TITLE&&TITLE.blocks&&!TITLE.blocks())return;   // 正在战斗：不刷新
  busy=true;
  fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.v&&d.v!==BUILD)return fetch('/index.html',{cache:'reload'}).then(function(){location.reload();});
  }).catch(function(){}).then(function(){busy=false;});
}
window.addEventListener('load',function(){setTimeout(check,1500);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
</script>

    g.gain.linearRampToValueAtTime(vel, t + (horn ? .065 : .025));
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    for (const detune of [-5, 5]) {
      const o = osc('triangle', m2f(midi), t);
      o.detune.value = detune;
      o.connect(filter); o.start(t); o.stop(t + dur + .05);
    }
  }

  // ---------- 循环曲 ----------
  function playStep(L, bar, st, t) {
    const T = L.track;
    const dp = T.drums[T.drumArr[bar]];
    if (dp) {
      const c = dp[st];
      if (c && c !== '.') { const d = DRUM[c]; if (d) (T.war ? warDrum : drum)(t, d[0], d[1] * T.lv.drum, L.gain); }
    }
    const ev = T.melMap.get(bar * 16 + st);
    if (ev && (!T.war || bar % 2 === 0 || (T.war > 1 && st === 0))) {
      pluck(t, dn(ev[0]), (ev[1] || .34) * T.lv.pluck, L.gain, ev[2] || (T.war ? 1 : .7));
    }
    if (st === 0 && T.tones && T.tones[bar]) {
      const [d, beats] = T.tones[bar];
      longTone(t, dn(d), beats * 60 / T.bpm, T.lv.tone, L.gain);
    }
    if (T.war) {
      const root = [0, 0, 3, 2][Math.floor(bar / 4) % 4];
      if (st === 0 || (T.war > 1 && st === 8)) {
        warVoice(t, dn(root), .33, T.war > 1 ? .075 : .035, L.gain);
      }
      if (T.war > 1 && bar % 8 === 0 && (st === 0 || st === 10)) {
        warVoice(t, dn([5, 8, 7][st === 0 ? 0 : st === 6 ? 1 : 2]), .42, .045, L.gain, true);
      }
    }
  }

  function newLayer(name, previous) {
    const T = TRACKS[name];
    const g = ac.createGain(); g.gain.value = .0001; g.connect(out);
    const L = { name, track: T, gain: g, step: 0, time: ac.currentTime + .12, spb: 60 / T.bpm / 4, nodes: [] };
    if (previous && T.sync && T.sync === previous.track.sync && T.bpm === previous.track.bpm) {
      L.step = previous.step; L.time = previous.time;
    }
    if (T.drone) {   // 低音持续音，跟着本曲一起淡入淡出
      const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = m2f(T.drone.midi);
      const dg = ac.createGain(); dg.gain.value = T.drone.level;
      const lfo = ac.createOscillator(); lfo.frequency.value = .17;
      const lg = ac.createGain(); lg.gain.value = T.drone.level * .45;
      lfo.connect(lg).connect(dg.gain);
      o.connect(dg).connect(g);
      o.start(); lfo.start();
      L.nodes.push(o, lfo);
    }
    layers.push(L);
    return L;
  }

  function stopLayer(L, dur) {
    if (!L || L.stopping) return;
    L.stopping = true;
    const t = ac.currentTime;
    L.gain.gain.cancelScheduledValues(t);
    L.gain.gain.setValueAtTime(Math.max(.0001, L.gain.gain.value), t);
    L.gain.gain.linearRampToValueAtTime(.0001, t + dur);
    setTimeout(() => {
      for (const n of L.nodes) { try { n.stop(); } catch (e) {} }
      try { L.gain.disconnect(); } catch (e) {}
      layers = layers.filter(x => x !== L);
    }, (dur + .25) * 1000);
  }

  function pump() {
    if (!ac || ac.state !== 'running') return;
    menuPump();
    const ahead = ac.currentTime + LOOK;
    for (const L of layers.slice()) {
      if (L.time < ac.currentTime - .2) L.time = ac.currentTime + .05;   // 被系统休眠/切后台后别补一堆音
      const total = L.track.bars * 16;
      while (L.time < ahead) {
        const s = L.step % total;
        playStep(L, Math.floor(s / 16), s % 16, L.time);
        L.step++; L.time += L.spb;
      }
    }
  }

  // ---------- 胜利 / 失败（一次性） ----------
  const JINGLE_LEN = { victory: 4.2, defeat: 4.8 };
  const JINGLES = {
    // 胜利：五声上行号角 + 鼓，落在明亮的宫和弦上
    victory(g, t) {
      [[0, 57], [.2, 64], [.4, 69], [.6, 72], [.8, 76], [1.0, 81]].forEach(([dt, m]) => {
        pluck(t + dt, m, .4, g, .9); drum(t + dt, 'kick', .42, g);
      });
      drum(t + 1.15, 'snare', .3, g);
      drum(t + 1.18, 'snare', .34, g);
      pluck(t + 1.3, 48, .28, g, 1.2);
      [60, 64, 67, 72].forEach(m => pluck(t + 1.3, m, .22, g, 2.3));
      drum(t + 1.3, 'kick', .8, g);
      longTone(t + 1.35, 72, 1.5, .2, g);
      drum(t + 2.25, 'kick', .3, g);
    },
    // 失败：低沉下行 + 一声哀凉的埙
    defeat(g, t) {
      drum(t, 'kick', .6, g);
      [[0, 69], [.45, 67], [.95, 64], [1.5, 62], [2.05, 60], [2.65, 57]].forEach(([dt, m], i) => {
        pluck(t + dt, m, .32 - i * .015, g, 1.2);
      });
      drum(t + 2.65, 'kick', .5, g);
      longTone(t + .9, 57, 2.4, .2, g);
      longTone(t + .9, 45, 2.4, .12, g);
      drum(t + 3.55, 'kick', .32, g);
    },
  };

  function playJingle(name) {
    stopJingle(.2);
    const g = ac.createGain(); g.gain.value = 1; g.connect(out);
    const t0 = ac.currentTime + .06;
    JINGLES[name](g, t0);
    jingle = g;
    const len = JINGLE_LEN[name] * 1000;
    setTimeout(() => { if (jingle === g) { jingle = null; try { g.disconnect(); } catch (e) {} } }, len);
  }
  function stopJingle(dur) {
    const g = jingle; if (!g) return;
    jingle = null;
    const t = ac.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(.0001, t + dur);
    setTimeout(() => { try { g.disconnect(); } catch (e) {} }, (dur + .1) * 1000);
  }

  // ---------- 状态 ----------
  // 读 game.js 的全局变量（同一个 <script> 里，let 声明的可以直接读；开局前是 TDZ，用 try 兜住）
  function readState() {
    try {
      if (window.ROUTE && ROUTE.on()) return 'file';   // 路线模式：放 Pixabay 曲子（FILEBGM），合成曲全部停
      // 主界面、整军备战、校场页：放《灯下》（js/menu_music.js）
      if (window.MENU_MUSIC && window.TITLE && TITLE.mode && ['title', 'chapter'].includes(TITLE.mode())) return 'menu';
      // 第二章素材加载中：直接进第二章行军鼓乐（此时 chapter2Run 还没建好，不能落到第一章曲子）
      if (window.CHAPTER_LOADING === 2) return 'warField';
      if (typeof won !== 'undefined' && won) return 'victory';
      if (typeof over !== 'undefined' && over) return 'defeat';
      if (typeof chapter2Run !== 'undefined' && chapter2Run && !(window.TITLE && TITLE.blocks())) {
        if (window.CHAPTER2_INTRO && CHAPTER2_INTRO.active()) return 'warField';
        const alive = typeof zs !== 'undefined' && zs ? zs.filter(z => z && !z.dead) : [];
        if (alive.some(z => z.T && (z.T.boss || z.T.chapterBoss))) return 'warBoss';
        if (chapter2Run.mode === 'fight' && alive.length) combatHoldUntil = performance.now() + 2400;
        if (['intro', 'choice', 'preview', 'victory', 'complete'].includes(chapter2Run.mode)) return 'warField';
        return performance.now() < combatHoldUntil ? 'warBattle' : 'warField';
      }
      // 第二章的校场也用第二章鼓乐
      const xc = window.XIAOCHANG && XIAOCHANG.active() && XIAOCHANG.state();
      if (xc && xc.chapter === 2) {
        const alive = typeof zs !== 'undefined' && zs ? zs.filter(z => z && !z.dead) : [];
        if (alive.some(z => z.T && (z.T.boss || z.T.chapterBoss))) return 'warBoss';
        return alive.length ? 'warBattle' : 'warField';
      }
      if (typeof zs !== 'undefined' && zs && zs.some && zs.some(z => z && z.T && z.T.boss && !z.dead)) return 'boss';
      if (typeof lockR !== 'undefined' && lockR < Infinity) return 'battle';
    } catch (e) {}
    return 'village';
  }

  // ---------- 菜单轻音乐《灯下》：逐小节排程，和战斗音乐交叉淡入淡出 ----------
  let menuGain = null, menuBus = null, menuOn = false, menuBar = 0, menuNext = 0;
  const MENU_LEVEL = 1.15;
  function menuStart() {
    if (!window.MENU_MUSIC) return;
    if (!menuGain) { menuGain = ac.createGain(); menuGain.gain.value = .0001; menuGain.connect(out); menuBus = MENU_MUSIC.makeBus(ac, menuGain); }
    const t = ac.currentTime;
    menuGain.gain.cancelScheduledValues(t); menuGain.gain.setValueAtTime(Math.max(.0001, menuGain.gain.value), t);
    menuGain.gain.linearRampToValueAtTime(MENU_LEVEL, t + XFADE);
    if (!menuOn) { menuOn = true; menuBar = 0; menuNext = t + .1; }
  }
  function menuStop() {
    if (!menuGain || !menuOn) return;
    menuOn = false;
    const t = ac.currentTime;
    menuGain.gain.cancelScheduledValues(t); menuGain.gain.setValueAtTime(Math.max(.0001, menuGain.gain.value), t);
    menuGain.gain.linearRampToValueAtTime(.0001, t + XFADE);
  }
  function menuPump() {
    if (!menuOn) return;
    if (menuNext < ac.currentTime - .2) menuNext = ac.currentTime + .05;   // 切后台回来不补放
    while (menuNext < ac.currentTime + 1.2) {
      MENU_MUSIC.render(ac, null, menuNext, menuBar, 1, menuBus);
      MENU_MUSIC.vinyl(ac, menuBus, menuNext, MENU_MUSIC.BAR + .05);
      menuNext += MENU_MUSIC.BAR; menuBar = (menuBar + 1) % MENU_MUSIC.BARS;
    }
  }

  function applyState(st) {
    const prev = state; state = st;
    if (st === 'menu') {
      stopJingle(.4);
      layers.filter(L => !L.stopping).forEach(L => stopLayer(L, XFADE));
      menuStart();
      return;
    }
    menuStop();
    if (st === 'file') { stopJingle(.4); layers.filter(L => !L.stopping).forEach(L => stopLayer(L, XFADE)); return; }
    if (st === 'victory' || st === 'defeat') {
      if (layers.length) { layers.slice().forEach(L => stopLayer(L, .6)); }
      if (prev !== st) playJingle(st);
      return;
    }
    stopJingle(.4);
    const cur = layers[layers.length - 1];
    if (cur && cur.name === st && !cur.stopping) return;
    layers.filter(L => !L.stopping).forEach(L => stopLayer(L, XFADE));
    const L = newLayer(st, cur);
    const t = ac.currentTime;
    L.gain.gain.setValueAtTime(.0001, t);
    L.gain.gain.linearRampToValueAtTime(1, t + XFADE);
  }

  function applyVolume() {
    if (!out) return;
    const t = ac.currentTime;
    out.gain.cancelScheduledValues(t);
    out.gain.setValueAtTime(out.gain.value, t);
    out.gain.linearRampToValueAtTime(muted ? .0001 : OUT_LEVEL * (dialogueQuiet ? .45 : 1) * (pauseDucked ? .3 : 1), t + .25);
  }

  // 系统有时会把音频上下文挂起（切后台、来电），在手势或轮询时顺手恢复
  function resumeAudio() { if (ac && ac.state === 'suspended' && !document.hidden) { try { ac.resume(); } catch (e) {} } }
  function poll() {
    if (!started || !ac) return;
    resumeAudio();
    const st = readState();
    if (st !== state) applyState(st);
    const m = !!(window.SFX && typeof SFX.isMuted === 'function' && SFX.isMuted());
    const quiet = !!(window.CHAPTER2_INTRO && CHAPTER2_INTRO.active());
    if (m !== muted || quiet !== dialogueQuiet) { muted = m; dialogueQuiet = quiet; applyVolume(); }
  }

  // ---------- 启动（浏览器要求先有用户操作） ----------
  function boot() {
    if (started) return;
    started = true;
    try {
      ac = new AC();
      loadSouthernDrum();
      out = ac.createGain();
      out.gain.value = .0001;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .2;
      // 手机喇叭放不出低频战鼓，给整体加一点高频，旋律和拨弦才听得见
      const hs = ac.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 2400; hs.gain.value = 4.5;
      out.connect(hs).connect(comp).connect(ac.destination);
      if (ac.state === 'suspended') ac.resume();
      muted = !!(window.SFX && typeof SFX.isMuted === 'function' && SFX.isMuted());
      out.gain.linearRampToValueAtTime(muted ? .0001 : OUT_LEVEL, ac.currentTime + 1.2);
      state = null;
      applyState(readState());
      schedT = setInterval(pump, 40);
      pollT = setInterval(poll, 300);
      document.addEventListener('visibilitychange', onVisible);
    } catch (e) {
      started = false;
      console.warn('[BGM] 启动失败：', e);
    }
  }

  // 切到后台就挂起，回来时把排程时间对齐，避免一次补放很多音
  function onVisible() {
    if (!ac) return;
    if (document.hidden) { try { ac.suspend(); } catch (e) {} return; }
    try { ac.resume(); } catch (e) {}
    const now = ac.currentTime;
    for (const L of layers) if (L.time < now) L.time = now + .1;
  }

  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, boot, { capture: true, passive: true }));
  ['pointerdown', 'touchend', 'keydown', 'click'].forEach(ev => addEventListener(ev, resumeAudio, { capture: true, passive: true }));

  // 供调试/其它模块使用（不改 game.js）
  window.BGM = {
    start: boot,
    state: () => state,
    isMuted: () => muted,
    setPauseDucked(value) { pauseDucked = !!value; applyVolume(); },
  };
})();

// 精英 = action drums 6（ashenrise）；首领 = serpents of war（epicaist）。结算时停，交给 SFX 的合成短曲。
(() => {
  if (typeof ASSETS === 'undefined' || !ASSETS.bgm) return;
  const LV = { title: .55, route: .5, battle: .5, elite: .55, boss: .55 };
  const el = {}; let cur = null, started = false;
  const get = k => { if (!el[k]) { const a = new Audio(); a.src = ASSETS.bgm[k]; a.loop = true; a.preload = 'auto'; a.volume = 0; el[k] = a; } return el[k]; };
  function scene() {
    try {
      if (window.TITLE && TITLE.mode && ['title', 'chapter', 'intro'].includes(TITLE.mode())) return 'title';
      if (window.KAIJU && KAIJU.active()) return 'title';
      if ((typeof won !== 'undefined' && won) || (typeof over !== 'undefined' && over)) return null;
      if (window.ROUTE && ROUTE.shown()) return 'route';
      const nd = window.SURV && SURV.curNode && SURV.curNode();
      if (!nd) return 'route';
      return nd.type === 'boss' ? 'boss' : nd.type === 'elite' ? 'elite' : 'battle';
    } catch (e) { return null; }
  }
  function tick() {
    const want = scene(), muted = !!(window.SFX && SFX.isMuted && SFX.isMuted()), duck = document.getElementById('pauseScreen') && !document.getElementById('pauseScreen').hidden ? .35 : 1;
    if (want !== cur) { if (want) { const a = get(want); if (a.paused) { try { a.currentTime = 0; } catch (e) {} a.play().catch(() => {}); } } cur = want; }
    for (const k in el) {
      const a = el[k], target = k === cur && !muted ? LV[k] * duck * (window.SZZSET ? SZZSET.get('bgm') : 1) : 0;   // 设置里的音乐音量
      a.volume = Math.max(0, Math.min(1, a.volume + Math.sign(target - a.volume) * Math.min(Math.abs(target - a.volume), .04)));   // 约 1.3 秒交叉淡入淡出
      if (a.volume === 0 && k !== cur && !a.paused) a.pause();
    }
  }
  try { get('title'); } catch (e) {}   /* 一加载就开始下主界面曲，玩家第一次点下去时已缓冲好 */
  /* 11/12 修：手机上第一下 pointerdown 不算「用户手势」，play() 被拒后再也不重试 → 主界面没声音。
     现在每次点击/抬手/按键都检查：该放的曲子还停着就再 play() 一次（必须在手势回调里同步调用才算数） */
  const kick = () => { const a = cur && el[cur]; if (a && a.paused && !(window.SFX && SFX.isMuted && SFX.isMuted())) a.play().catch(() => {}); };
  const go = () => { if (!started) { started = true; setInterval(tick, 50); tick(); } kick(); };
  ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(ev => addEventListener(ev, go, { capture: true, passive: true }));
  /* 11/12 用户：开局不点也要有音乐，「点击任意处开始」和加载有机结合 →
     脚本一跑就先试着放主界面曲（浏览器允许时直接出声，比如常来的 Chrome、装到桌面的版本）；
     加载幕（index.src.html 的 bootDone）会等主界面曲缓冲好，再看 auto：放出来了就直接揭幕，没放出来就在进度条位置显示「点击任意处开始」，点一下音乐和首页一起出来 */
  const T = window.BGM_TITLE = { audio: get('title'), auto: false, start: go };
  T.audio.play().then(() => { T.auto = true; if (!started) { started = true; setInterval(tick, 50); tick(); } }).catch(() => {});

})();

function drawChargeAura(h) {
  const p = chargeRatio(), t = performance.now() / 1000, pulse = .5 + .5 * Math.sin(t * (7 + p * 5));

// 献祭：主角身上一层淡红色光晕；敌人贴身每秒叠 1 层（最多 3 层），层数越高红光越亮、光环越多。
function drawFireAura(h) {
  if (!window.ROGUE || !ROGUE.fireAura) return;
  const A = ROGUE.fireAura(); if (!A.active) return;
  const lv = Math.max(1, Math.min(3, A.stacks || 1));
  const t = performance.now() / 1000, pulse = .5 + .5 * Math.sin(t * 2.6);

  ctx.save();
  const g = ctx.createRadialGradient(h.x, h.y - 18, 3, h.x, h.y - 18, R);
  g.addColorStop(0, `rgba(255,86,66,${.20 + lv * .035 + pulse * .02})`);
  g.addColorStop(.55, `rgba(214,42,44,${.13 + lv * .025})`);
  g.addColorStop(1, 'rgba(140,16,26,0)');

    ctx.save();
    ctx.strokeStyle = `rgba(255,104,82,${.26 - i * .05 + pulse * .03})`;
    ctx.lineWidth = 1.4;
    ctx.shadowColor = 'rgba(255,70,50,.55)';
    ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.ellipse(h.x, h.y - 17, rx, ry, 0, 0, 7); ctx.stroke();
    ctx.restore();
  }
  // 贴地范围圈：淡红，尽量不抢画面
  ctx.save();
  ctx.strokeStyle = `rgba(255,96,78,${.12 + lv * .04})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.ellipse(h.x, h.y, 24, 10, 0, 0, 7); ctx.stroke();
  ctx.restore();
  // 缓缓上升的火星
  ctx.save();
  for (let i = 0; i < lv * 4; i++) {
    const ph = (t * (.32 + i * .045) + i * .37) % 1;
    const x = h.x + Math.sin(t * 1.6 + i * 2.3) * (9 + lv * 2.4);
    const y = h.y - 7 - ph * (26 + lv * 6);

    ctx.fillStyle = i % 2 ? '#ff9a64' : '#ff4a3a';
    ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
  }
  ctx.restore();
}

    ctx.globalAlpha = Math.max(0, Math.min(1, f.life / f.max * 1.8));
    // 先画一圈深色描边，否则黄稻草落在黄土地上根本看不见（和像素角色的描边风格一致）
    ctx.fillStyle = '#2a1c0c';
    ctx.fillRect(f.x - f.w / 2 - .5, f.y - f.h / 2 - .5, f.w + 1, f.h + 1);
    ctx.fillStyle = f.c;
    ctx.fillRect(f.x - f.w / 2, f.y - f.h / 2, f.w, f.h);
  }
  ctx.globalAlpha = 1;
}

// 手机全屏提示：只要用手机打开就强制显示，直到在标题页勾选「关闭提醒」。
// 浏览器一定有工具栏/地址栏，只有"添加到主屏幕"后从桌面图标进入才是真全屏。
(function () {
  const KEY = 'szz-hint-off';          // 勾选"关闭提醒"后写 '1'

  function ua() { return navigator.userAgent || ''; }
  function isMobile() { return /Android|iPhone|iPad|iPod|Mobile|MicroMessenger/i.test(ua()); }
  function isStandalone() {
    return (window.navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function off() { try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; } }

  // 常见 App 的内置浏览器（菜单里没有"添加到主屏幕"，必须先"在浏览器打开"）
  const INAPP = [
    [/MicroMessenger/i, '微信'],
    [/AlipayClient/i, '支付宝'],
    [/Weibo/i, '微博'],
    [/aweme|ByteLocale|BytedanceWebview|TikTok/i, '抖音'],
    [/DingTalk/i, '钉钉'],
    [/xhsdiscover|XHS/i, '小红书'],
    [/Kwai|Kuaishou/i, '快手'],
    [/baiduboxapp/i, '百度'],
    [/QQ\/|QQBrowser/i, 'QQ'],
  ];
  function inAppName() {
    const u = ua();
    for (const [re, name] of INAPP) if (re.test(u)) return name;
    return '';
  }

  function text() {
    const u = ua(), app = inAppName();
    if (app) return app + '里玩会留黑边：点右上角「···」→「在浏览器打开」→ 浏览器菜单里「添加到主屏幕」，之后从桌面图标进入才是全屏。';
    if (/Android/i.test(u)) return '加到主屏幕才能全屏：浏览器右上角「⋮」→「添加到主屏幕」，之后从桌面图标进入。';
    if (/iPhone|iPad|iPod/i.test(u)) return '加到主屏幕才能全屏：底部「分享」→「添加到主屏幕」，之后从桌面图标进入。';
    return '加到主屏幕才能全屏：浏览器菜单里选「添加到主屏幕」，之后从桌面图标进入。';
  }

  const CSS = `
  #wzbHint{display:none;position:fixed;left:0;right:0;top:0;z-index:26;
    padding:0 calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));
    font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Pixel12,sans-serif;pointer-events:none}
  body.szz-title #wzbHint.on{display:flex}
  #wzbHint .box{flex:1;max-width:640px;margin:0 auto;background:rgba(30,20,34,.92);
    border:1.5px solid #c9971f;border-radius:12px;padding:9px 13px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
  #wzbHint .tx{color:#f2e6c9;font-size:12.5px;line-height:1.55;letter-spacing:.02em}
  #wzbHint .tail{margin-top:3px;color:#b9a273;font-size:11.5px}`;

  let box = null;

  function ensure() {
    if (box) return;
    if (!document.getElementById('wzbHintCss')) {
      const st = document.createElement('style'); st.id = 'wzbHintCss'; st.textContent = CSS;
      document.head.appendChild(st);
    }
    box = document.createElement('div');
    box.id = 'wzbHint';
    box.innerHTML = '<div class="box"><div class="tx"></div><div class="tail">不想看这条？在标题页勾选「关闭提醒」</div></div>';
    box.querySelector('.tx').textContent = text();
    document.body.appendChild(box);
  }

  // 放在「英雄榜」上方，避开输入框 / 简单模式 / 开始游戏
  function place() {
    if (!box) return;
    const anchor = document.getElementById('tBoard') || document.getElementById('tName') || document.getElementById('tStart');
    const h = box.offsetHeight || 60;
    let top = (innerHeight - h) * 0.35;
    if (anchor) top = Math.max(8, anchor.getBoundingClientRect().top - h - 10);
    box.style.top = Math.round(top) + 'px';
  }

  function tick() {
    if (!box) ensure();
    const landscape = innerWidth > innerHeight;   // 竖屏时游戏的"请横屏"提示更重要，别挡它
    const shouldShow = isMobile() && !isStandalone() && !off() && landscape && document.body.classList.contains('szz-title');
    const on = box.classList.contains('on');
    if (shouldShow && !on) { box.classList.add('on'); place(); addEventListener('resize', place); }
    else if (!shouldShow && on) box.classList.remove('on');
  }

  setInterval(tick, 500);
  addEventListener('DOMContentLoaded', tick);
})();

// 音效：Web Audio 实时合成，不需要外部音频文件。
// 设计思路：每个音效由几层组成（瞬态 + 主体 + 尾音），用滤波后的噪声做挥风、布料、泥土，
// 用正弦/三角波做身体闷响和木头敲击，用不和谐泛音做金属声；每次播放带一点随机音高和音量，
// 避免连打时像机关枪；按画面左右位置做立体声；主输出经过轻微混响和压缩，让所有声音像在同一个空间里。
(() => {
  const KEY = 'szz-muted';
  let muted = false, pauseDucked = false;
  try { muted = localStorage.getItem(KEY) === '1'; } catch (e) {}
  let ac, master, verb, noiseBuf, fallbackEl;

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return ac; }
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    ac = new A();
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .15;
    master = ac.createGain(); master.gain.value = .8 * (window.SZZSET ? SZZSET.get('sfx') : 1);
    master.connect(comp).connect(ac.destination);
    // 短混响：户外村庄，空间感很轻
    const len = Math.floor(ac.sampleRate * .7), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2); }
    const conv = ac.createConvolver(); conv.buffer = ir;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
    verb = ac.createGain(); verb.gain.value = .22;
    verb.connect(conv).connect(lp).connect(master);

  }

  // 每次播放建立一条输出线：音量 → 立体声 → 主输出 + 混响

  function env(param, t, peak, a, d, curve = 'exp') {

  function noise(out, t, { type = 'bandpass', f0 = 1000, f1 = f0, q = 1, gain = .5, a = .005, d = .1, hp = 0 }) {

      { x: 470, y: 220, hp: 2, f: -1, dead: 0, vx: 0, st: 'idle', t: 0, flash: 0, kind: 'grunt' },
    ];
    D.props = [{ x: 270, y: 250, g: 'hay' }, { x: 560, y: 236, g: 'flag' }];
  }

  function demoStep(dt) {
    D.t += dt;
    const h = D.hero, SC = demoCv.height / VIEWH;
    // 主角：走向最近的活着的敌人 → 贴身打一套
    const foe = D.foes.find(f => !f.dead);
    if (!foe) {
      if (h.st !== 'walk') { h.st = 'walk'; h.t = 0; }
      h.f = 1; h.x += 70 * dt;
      if (h.x > 700) { if (!D.over) D.over = D.t; if (D.t - D.over > 1.2) { D.over = 0; demoReset(); } }
    } else if (h.atk) {
      h.t += dt;
      const [a, b] = ATK[h.c];
      if (h.fi === 0 && h.t >= a) {
        h.fi = 1;   // 出手
        const dx = (foe.x - h.x) * h.f;
        if (dx > -6 && dx < 40 && Math.abs(foe.y - h.y) < 14) {
          foe.hp--; foe.flash = .12; foe.vx = h.f * 90;
          if (foe.hp <= 0) { foe.dead = 1; foe.vy = 120; foe.z = 1; foe.t = 0; h.killed++; }
        }
        if (h.c === 2) {   // 第三段扫到旁边的人
          for (const o of D.foes) if (!o.dead && o !== foe && Math.abs(o.x - h.x) < 45) { o.hp--; o.flash = .12; o.vx = h.f * 80; if (o.hp <= 0) { o.dead = 1; o.vy = 120; o.z = 1; o.t = 0; h.killed++; } }
        }
      }
      if (h.t >= a + b) {
        h.t = 0; h.fi = 0; h.c++;
        if (h.c > 2) { h.c = 0; h.atk = false; h.st = 'idle'; }
      }
    } else {
      const dx = foe.x - h.x;
      h.f = Math.sign(dx) || h.f;
      if (Math.abs(dx) > 34) { h.st = 'walk'; h.x += Math.sign(dx) * 76 * dt; }
      else { h.st = 'atk'; h.atk = true; h.c = 0; h.fi = 0; h.t = 0; }
    }
    // 敌人：被击退 → 落地
    for (const f of D.foes) {
      f.flash = Math.max(0, f.flash - dt);
      if (f.vx) { f.x += f.vx * dt; f.vx *= .82; if (Math.abs(f.vx) < 3) f.vx = 0; }
      if (f.dead) { f.t += dt; if (f.z) { f.vy -= 420 * dt; f.z += f.vy * dt; if (f.z <= 0) { f.z = 0; f.vy = 0; } } }
    }
    // 镜头：跟着主角，但限制在演示世界里
    const vw = demoCv.width / SC;
    const want = h.x - vw * .42;
    D.camX += (Math.max(0, Math.min(640 - vw, want)) - D.camX) * Math.min(1, dt * 4);
  }

  function dChar(c, name, f, x, y, flip, alpha, white) {
    const fr = CH[name] && CH[name][f]; if (!fr || !fr.img.complete) return;
    const SC = demoCv.height / VIEWH, sp = Math.max(.5, SC * PX);
    const sx = Math.round(x * SC), sy = Math.round(y * SC);
    c.save(); c.setTransform(1, 0, 0, 1, sx, sy); if (flip) c.scale(-1, 1);
    c.globalAlpha = alpha == null ? 1 : alpha;
    c.imageSmoothingEnabled = false;
    c.drawImage(white && fr.white ? fr.white : fr.img, -fr.ax * sp, -fr.ay * sp, fr.w * sp, fr.h * sp);
    c.restore();
  }

  function demoRender() {
    const c = dctx, W = demoCv.width, H = demoCv.height, SC = H / VIEWH;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#160f1a'; c.fillRect(0, 0, W, H);
    // 背景（视差）—— 和游戏里同样的贴图方式
    const layer = (img, s, par, y) => {
      if (!img || !img.complete || !img.width) return;
      const tw = img.width * s, vw = W / SC, ox = D.camX * (1 - par);
      for (let i = Math.floor((D.camX - ox) / tw) - 1; i * tw + ox < D.camX + vw; i++) {
        const x = i * tw + ox;
        c.save(); c.translate((x - D.camX) * SC, y * SC); c.scale(SC, SC);
        c.drawImage(img, 0, 0, tw + .5, img.height * s);
        c.restore();
      }
    };
    const ms = .24 / .61, my = 165 - 619 * .24;
    layer(bgFar, .577, .3, 0);
    layer(bgGnd, .62, 1, my + 560 * ms);
    layer(bgMid, ms, 1, my);
    // 地面上的东西按 y 排序
    const list = [];
    for (const p of D.props) list.push({ y: p.y, d: () => {
      const pr = ASSETS.props[p.g]; if (!pr) return;
      const [, w, h] = pr; const im = IMG['p_' + p.g];
      if (!im || !im.complete) return;
      c.save(); c.translate((p.x - D.camX) * SC, p.y * SC); c.scale(SC, SC); c.drawImage(im, -w / 2, -h + 2, w, h); c.restore();
    } });
    for (const f of D.foes) list.push({ y: f.y, d: () => {
      const fr = f.dead ? 'down' : (f.flash > 0 ? 'hurt' : (f.vx ? 'hurt' : 'walk1'));
      const x = f.x - D.camX, a = f.dead ? Math.max(0, 1 - Math.max(0, f.t - .5)) : 1;
      dChar(c, f.kind, fr, x, f.y - (f.z || 0), f.f > 0, a, f.flash > 0);
    } });
    const h = D.hero;
    list.push({ y: h.y, d: () => {
      const fr = h.atk ? AF[h.c][h.fi] : (h.st === 'walk' ? 'staffw' + (Math.floor(h.t * 8) % 4 + 1) : 'staff0');
      const nm = h.st === 'walk' ? 'staffw' + ([1, 2, 3, 2][Math.floor(h.t * 8) % 4]) : fr;
      dChar(c, 'hero', h.st === 'walk' ? nm : fr, h.x - D.camX, h.y, h.f < 0, 1, false);
    } });
    c.setTransform(1, 0, 0, 1, 0, 0);
    list.sort((a, b) => a.y - b.y).forEach(o => o.d());
  }

  let lastPreviewFrame = '';
  let previewObserver = null;
  function drawPreviewFrame(frameName) {
    const canvas = dom.chapter && dom.chapter.querySelector('#tPrepPreview canvas');
    if (!canvas || typeof CH === 'undefined') return;
    const g = canvas.getContext('2d');
    if (!g) return;
    // 画布像素尺寸跟着预览框的比例走（高固定400），CSS 只做等比缩放，人物不会被压扁。
    const box = canvas.getBoundingClientRect();
    if (box.width > 0 && box.height > 0) {
      const H = 480, W = Math.max(190, Math.round(H * box.width / box.height));   // 高480：3倍时长戟（136像素高）竖着也放得下
      if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
    }
    lastPreviewFrame = frameName;
    g.clearRect(0, 0, canvas.width, canvas.height);
    const frame = CH.hero && (CH.hero[frameName] || CH.hero.idle);
    if (!frame) return;
    if (!frame.img.complete) {
      if (!frame.previewPending) {
        frame.previewPending = true;
        frame.img.addEventListener('load', () => {
          frame.previewPending = false;
          if (dom.chapter && dom.chapter.classList.contains('open')) drawPreviewFrame(frameName);
        }, { once: true });
      }
      return;
    }
    if (!frame.img.naturalWidth) return;
    const baseH = 74;   // 以主角身高为基准，所有武器/攻击帧统一比例
    // 不能用 frame.w（武器长度）限制缩放，否则长戟攻击帧会把人物缩小，预览忽大忽小。
    const scale = 3;   // 画布高固定480：主角按3倍整数缩放，约占框高46%
    // 长戟按人物同倍率画，锚点向左留出完整135px武器和轨迹的空间。
    const centerX = previewWeapon === 'halberd' ? canvas.width * .32 : canvas.width / 2;
    const footY = Math.round(canvas.height * .9);   // 脚底踩在框高约90%处，头顶留出长武器的位置
    g.fillStyle = 'rgba(12,9,7,.42)';
    g.beginPath(); g.ellipse(previewWeapon === 'halberd' ? centerX + 6 * scale : centerX, footY + 2, 20 * scale, 3.5 * scale, 0, 0, Math.PI * 2); g.fill();
    const x = Math.round(centerX - frame.ax * scale);
    const y = Math.round(footY - frame.ay * scale);
    g.imageSmoothingEnabled = false;
    g.drawImage(frame.img, x, y, frame.w * scale, frame.h * scale);
  }

  function idlePreviewFrame(id) {
    if (id === 'halberd') return 'halberd0';
    if (id === 'hammer') return 'hammer0';
    if (id === 'staff') return 'staff0';
    if (id === 'stone') return 'stone0';
    if (id === 'bow') return 'bow0';
    return id + '0';
  }

  function drawPreviewIdle(id) {
    previewWeapon = ITEMS[id] ? id : 'staff';
    drawPreviewFrame(idlePreviewFrame(previewWeapon));
  }

  function playWeaponPreview(id) {
    if (!ITEMS[id]) return;
    previewWeapon = id;
    const base = id === 'halberd' ? 'halberd' : id;
    const combo = typeof WEAP !== 'undefined' && WEAP[base] ? WEAP[base].combo : [];
    const frames = [];
    combo.forEach(step => step.f.forEach((frame, i) => frames.push({ frame, duration: Math.max(.06, (step.d[i] || .12) * 1000) })));
    if (!frames.length) { drawPreviewIdle(id); return; }
    if (previewRaf) cancelAnimationFrame(previewRaf);
    previewAnimation = { id, frames, start: performance.now(), total: frames.reduce((sum, frame) => sum + frame.duration, 0) };
    const tick = now => {
      if (!previewAnimation || !dom.chapter.classList.contains('open')) { previewAnimation = null; previewRaf = 0; return; }
      const elapsed = now - previewAnimation.start;
      let frameName = frames[frames.length - 1].frame;
      if (elapsed < previewAnimation.total) {
        let time = elapsed;
        for (const frame of frames) {
          if (time < frame.duration) { frameName = frame.frame; break; }
          time -= frame.duration;
        }
      } else if (elapsed >= previewAnimation.total + 1000) {
        previewAnimation = null; previewRaf = 0;
        drawPreviewIdle(id);
        return;
      }
      drawPreviewFrame(frameName);
      previewRaf = requestAnimationFrame(tick);
    };
    tick(performance.now());
  }

  function beginLoadoutPointer(e) {

    pointerDrag = { id: itemId, source: itemNode ? 'bag' : 'slot', sourceSlot: slotNode && slotNode.dataset.slot, pointerId: e.pointerId, x: e.clientX, y: e.clientY, moved: false };
    try { e.target.setPointerCapture(e.pointerId); } catch (_) {}
  }

  function moveLoadoutPointer(e) {
    if (!pointerDrag || e.pointerId !== pointerDrag.pointerId) return;
    const drag = pointerDrag, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 7) return;

    const target = document.elementFromPoint(e.clientX, e.clientY);

  }

  function endLoadoutPointer(e) {
    if (!pointerDrag || (e.pointerId !== undefined && e.pointerId !== pointerDrag.pointerId)) return;
    const drag = pointerDrag; pointerDrag = null;
    const ghost = dom.chapter && dom.chapter.querySelector('#tPrepGhost');

  function startSelectedChapter() {

      if (!S.booted) {   // 加载幕（11/11）：首页背景图和书法标题都下载好才揭幕，揭幕时首页入场动画从头播

            for (const e of [ti, dom.name, dom.start, dom.cont, dom.novice, dom.hintOff, dom.board, dom.seal, dom.sub]) if (e) { e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; }

  }
  boot();

  function skills(w) { const t = T(); return Object.keys(t.SK).filter(k => !t.SK[k].off && t.wepOf(k) === w).sort((a, b) => (t.SK[a].tier || 0) - (t.SK[b].tier || 0)); }

    if (typeof tab === 'number') {
      const w = ORDER[tab], ks = skills(w);

      if (sel && t.SK[sel]) { const s = t.SK[sel], i = ks.indexOf(sel); dt = `<b>${t.WEPN[w]} · 第 ${i + 1} 招 · ${s.name}</b>　${t.TIERN[s.tier || 0]}阶 · 动作：${MOTN[t.MOT[sel]] || '—'}<br>${s.desc}<br><span style="opacity:.65">当前伤害倍率 ×${t.mul(sel).toFixed(2)}（出身、属性、熟练都算在内）</span>`; }

// 无名之辈·序章 幻想三国录 —— 宽地面清版
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const IMG = {};
// 图片排队下载（用户定：别一打开就同时开几十个下载把网速占满）：同时最多 4 张，下完一张再开下一张
const LOADQ = []; let loadingN = 0;
function pumpLoad() { while (loadingN < 4 && LOADQ.length) { const [i, src] = LOADQ.shift(); if (i.src) continue; loadingN++; const done = () => { loadingN--; pumpLoad(); }; i.addEventListener('load', done, { once: true }); i.addEventListener('error', done, { once: true }); i.src = src; } }

function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
// 评价：无伤 SSS；被打 1~3 下 S；其余按用时 A~E（分数先这么定，实测后再调）
// 倒下时随机说一句（按打到第几波分档），让每次都死得不太一样
const DEATH_LINES = {
  early: ['这就完了？我连这是哪一年都没问清楚。', '汉朝的路，比我想的难走。'],
  mid: ['黄巾贼……怎么打不完。', '再给我一口气，我还能站起来。'],
  boss: ['差一点……就差这一下！', '管亥，你等着。'],
  any: ['无名之辈，也不能就这么交待在这儿。'],
};
function deathLine() {
  const stage = gateI >= 4 ? 'boss' : gateI >= 2 ? 'mid' : 'early';
  const pool = DEATH_LINES[stage].concat(DEATH_LINES.any);
  return pool[Math.floor(Math.random() * pool.length)];
}
// 评分 = 击杀×10 + 通关数×100 + 通关时间分（(900-秒)×0.4，不封顶）+ 无伤分（最多 +200）
// 死掉没有时间分；每被打 1 下扣 20 分
function scoreOfRun(kills, t, cleared, win, hits) {
  const progress = Math.max(0, Math.min(6, cleared)) * 100;
  const speed = win ? Math.max(0, Math.round((900 - t) * .4)) : 0;
  const safe = Math.max(0, 200 - Math.max(0, Math.min(99, hits || 0)) * 20);
  return kills * 10 + progress + speed + safe;
}
function rankOf(t) {
  if (hitsTaken === 0) return 'SSS';
  if (hitsTaken <= 3) return 'S';
  if (t <= 180) return 'A';
  if (t <= 240) return 'B';
  if (t <= 320) return 'C';
  if (t <= 420) return 'D';
  return 'E';
}

{ let pend = null;   // iPhone 有时只给 pointerdown/up、吞掉 click（11/11 点击诊断确认）：手指抬起 0.35 秒内没等到 click，就替它补一下；等到了就不补，不会重复
