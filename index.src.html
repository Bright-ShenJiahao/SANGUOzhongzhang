<style>
#bootSplash{position:fixed;inset:0;z-index:99999;background:radial-gradient(ellipse at 50% 45%,#f3e4cf 0%,#ecd9c0 55%,#d9c09f 100%);transition:opacity .45s ease-out}
#bootSplash.out{opacity:0;pointer-events:none}
#bootSlot{position:absolute;left:75.5%;top:72%;transform:translate(-50%,-50%);width:min(30vw,300px);min-width:180px;display:flex;flex-direction:column;align-items:center;gap:12px;font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;color:#3b2a1c}
@media (max-aspect-ratio:9/10){#bootSlot{left:50%;top:auto;bottom:9%;transform:translateX(-50%);width:72vw;max-width:300px}}
#bootInk{position:relative;width:100%;height:12px}
#bootInk i{position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,rgba(30,20,12,.95),rgba(30,20,12,.88) 85%,rgba(30,20,12,.35));border-radius:2px 60% 60% 6px/2px 50% 50% 6px;transition:width .35s ease-out;box-shadow:0 0 3px rgba(30,20,12,.35)}
#bootInk::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(60,40,24,.18)}
#bootText{font-size:16px;letter-spacing:.3em;font-weight:600;min-height:1.2em}
#bootRefresh{font:600 15px "Songti SC","Noto Serif SC",serif;letter-spacing:.2em;padding:10px 22px;color:#f1e2c6;background:#2e2016;border:1px solid #7a5a3a;border-radius:4px}
#bootError{font-size:12px;opacity:.7;overflow-wrap:anywhere;max-width:90vw;text-align:center}
</style>
<div id="bootSplash"><div id="bootSlot"><div id="bootInk"><i id="bootBar"></i></div><strong id="bootText">整军备马……</strong><button id="bootRefresh" hidden onclick="location.reload()">网络较慢，点此刷新</button><small id="bootError"></small></div></div>
<script>
(function(){
var ready=false,failed=false,p=0,el=function(i){return document.getElementById(i);},
 words=['整军备马……','磨刀霍霍……','黄巾已至……','点将出征……'],wi=0,
 timer=setTimeout(function(){if(!ready)el('bootRefresh').hidden=false;},10000),
 tick=setInterval(function(){if(failed)return;p+=(0.9-p)*0.06;el('bootBar').style.width=(p*100)+'%';},120),   // 假进度：慢慢逼近九成，真正好了再写满
 say=setInterval(function(){if(failed)return;wi=(wi+1)%words.length;el('bootText').textContent=words[wi];},2000);
function error(message){if(ready)return;failed=true;el('bootText').textContent='加载出错';el('bootRefresh').hidden=false;el('bootError').textContent=String(message||'未知错误');}
window.addEventListener('error',function(e){if(e.message)error(e.message);});
window.addEventListener('unhandledrejection',function(e){error(e.reason&&e.reason.message||e.reason);});
// 脚本跑完只算「代码好了」；等首页背景图和书法标题也下载好，title.js 再调 bootDone 揭幕（11/11 用户定：加载提示放在登录框的位置）
window.finishBoot=function(){if(failed)return;ready=true;clearTimeout(timer);};
window.bootDone=function(){if(failed)return;ready=true;clearTimeout(timer);clearInterval(tick);clearInterval(say);el('bootBar').style.width='100%';el('bootText').textContent='出 征';
 setTimeout(function(){var s=el('bootSplash');if(!s)return;s.classList.add('out');setTimeout(function(){s.remove();},500);},250);};
if(location.protocol==='https:'&&!/[?&]debug(?:=|&|$)/.test(location.search)&&'serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
})();
// 自动更新：打开游戏、或从后台切回来时，查一下线上有没有新版本；有就在标题/整备页自动刷新（战斗中不打扰）
(function(){
var BUILD='__BUILD__',busy=false;
if(location.protocol!=='https:'||/[?&]debug(?:=|&|$)/.test(location.search))return;
function check(){
  if(busy)return;
  if(window.TITLE&&TITLE.blocks&&!TITLE.blocks())return;   // 正在战斗：不刷新
  busy=true;
  fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.v&&d.v!==BUILD)return fetch('/index.html',{cache:'reload'}).then(function(){location.reload();});
  }).catch(function(){}).then(function(){busy=false;});
}
window.addEventListener('load',function(){setTimeout(check,1500);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
</script>
