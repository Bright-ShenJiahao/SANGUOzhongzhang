<title>三国：战至终章</title><style>
html,body{margin:0;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:#0c0907;font-family:system-ui,"PingFang SC","Noto Sans CJK SC",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh}
#top{position:fixed;left:0;right:0;top:0;display:flex;gap:6px;padding:8px calc(10px + env(safe-area-inset-left));align-items:center;flex-wrap:wrap;z-index:2;pointer-events:none}
button{font:inherit;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.55);background:rgba(20,14,30,.35);color:#fff;text-shadow:0 1px 2px #000;border-radius:7px;padding:4px 8px;touch-action:none}
button.on{background:rgba(255,216,110,.85);color:#2a2234;text-shadow:none;border-color:#ffd86e}
#wp{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(6px + env(safe-area-inset-top));display:flex;gap:5px;z-index:3;align-items:center}
#wp button[data-w]{width:48px;height:48px;padding:4px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wp button[data-w] img{width:36px;height:36px;object-fit:contain;image-rendering:pixelated;pointer-events:none}
#wp button[data-w] img[data-weapon-icon="w_bow"]{width:32px;height:34px;object-fit:contain}
#wp button[data-w] img[data-weapon-icon="w_halberd"]{width:38px;height:32px;object-fit:contain}
#bWeapon{width:42px;height:42px;padding:0;border-radius:50%;font-size:22px;line-height:1;color:#f3d37b;border-color:rgba(224,184,99,.8);background:rgba(54,38,24,.76)}
#bWeapon:active{background:rgba(130,91,43,.92);transform:rotate(30deg)}
#bMute{min-width:40px;height:42px;padding:0 7px}
#joy{position:fixed;left:0;bottom:0;width:50%;height:70%;z-index:1;touch-action:none}
#base{position:absolute;left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35)}
#knob{position:absolute;left:25px;top:25px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.4)}
.big{position:fixed;z-index:3;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.5);color:#fff;text-shadow:0 1px 3px #000}
.big:active{background:rgba(255,255,255,.3)}
/* 透明按钮，贴近右下角 */
#bA{right:calc(14px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));width:72px;height:72px;background:rgba(210,60,48,.28);border-color:rgba(255,160,150,.7)}
#bA:active{background:rgba(210,60,48,.5)}
#bA::after{content:"";position:absolute;inset:-6px;border-radius:50%;pointer-events:none;opacity:0;background:conic-gradient(from -90deg,var(--charge-color,#ffe08a) 0deg var(--charge-angle,0deg),rgba(255,224,138,.12) var(--charge-angle,0deg) 360deg);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
#bA.charging::after{opacity:1;filter:drop-shadow(0 0 4px rgba(255,210,100,.8))}
#bA.charged::after{animation:charge-pulse .65s ease-in-out infinite alternate}
@keyframes charge-pulse{to{filter:drop-shadow(0 0 9px #8de5ff)}}
#bR{right:calc(96px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));width:54px;height:54px;font-size:13px}
#bSkill{display:none;right:calc(18px + env(safe-area-inset-right));bottom:calc(98px + env(safe-area-inset-bottom));width:96px;height:44px;border-radius:18px;font-size:12px;background:rgba(174,126,45,.82);border-color:rgba(255,226,151,.85)}
body.szz-summon #bSkill{display:flex}
#bCatapult{display:none;position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(146px + env(safe-area-inset-bottom));width:96px;height:42px;border-radius:16px;z-index:6;
  background:rgba(96,60,26,.92);border:2px solid #c9971f;color:#f3d37b;font:700 14px "PingFang SC",sans-serif}
body.szz-catapult #bCatapult{display:block}
body.szz-summon #bSkill:disabled{filter:saturate(.6)}
#help{position:fixed;left:10px;bottom:8px;font-size:12px;color:#ddd;text-shadow:0 1px 2px #000;z-index:2;pointer-events:none}
body.szz-rogue #top,body.szz-rogue #wp,body.szz-rogue #joy,body.szz-rogue .big,body.szz-rogue #help{display:none}
body.szz-rogue #bSkill,body.szz-rogue #bCatapult{display:none!important}
@media (max-width:600px){#wp{gap:3px}#wp button[data-w]{width:42px;height:44px}#wp button[data-w] img{width:36px;height:36px}#bWeapon{width:38px;height:38px}#bMute{min-width:36px;height:38px}}
@media (pointer:coarse){
  #wp{gap:6px} #wp button[data-w]{width:52px;height:52px;min-width:52px;padding:6px}
  #bWeapon{position:fixed;right:calc(23px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:54px;height:54px;z-index:7;font-size:14px;background:radial-gradient(circle at 30% 25%,#79613bcc,#352719e8);box-shadow:0 2px 5px #21160d88}
  #bSkill{right:calc(2px + env(safe-area-inset-right));bottom:calc(164px + env(safe-area-inset-bottom))}
  #bCatapult{right:calc(2px + env(safe-area-inset-right));bottom:calc(216px + env(safe-area-inset-bottom))}
  body.szz-catapult:not(.szz-summon) #bCatapult{bottom:calc(164px + env(safe-area-inset-bottom))}
  #bWeapon:active{transform:translateY(1px);background:#8a653b}
  #wp button.weapon-pending{outline:2px dashed #e4c779;outline-offset:1px}
  #bA,#bR,#bSkill,#bCatapult,#bWeapon{touch-action:none;-webkit-user-select:none}
}
body.szz-pro #help{display:none}
#rot{display:none;position:fixed;inset:0;z-index:2147483000;background:radial-gradient(ellipse at 50% 45%,#221a13,#0c0907);color:#e6c98a;font-family:"Songti SC","Noto Serif SC",serif;font-size:20px;font-weight:800;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.8;padding:0 24px}
@media (pointer:coarse){#help{display:none}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:flex}}
@media (pointer:coarse) and (orientation:portrait){body.ontitle #rot{display:none}}   /* 11/11：竖屏也能看主界面（竖幅水墨），点「新的旅途/继续」进游戏后才提示横过来 */
@media (pointer:coarse){
#cloudRetry,#cloudPin{min-width:34px!important;min-height:32px!important}
#tHelp{min-width:34px!important;min-height:34px!important}
.shopBuy{min-height:34px!important;padding:0 10px!important}.shopPrice{white-space:nowrap}
#masteryPanel .mx{min-height:34px!important;padding:2px 14px!important}
.x-back{min-height:34px!important}
}
#rot small{display:block;margin-top:10px;font-size:14px;font-weight:600;color:#c9b691;line-height:1.6}

 line=function(){el('bootText').textContent=words[wi]+'中…… '+pc();},
 timer=setTimeout(function(){if(!ready)el('bootRefresh').hidden=false;},10000),
 tick=setInterval(function(){if(failed)return;p+=(0.9-p)*0.06;el('bootBar').style.width=(p*100)+'%';el('bootBigInk').style.clipPath='inset(0 '+(100-p*100)+'% 0 0)';if(!ready)line();},120),   // 11/13：大字「出征」跟着进度一笔一笔显出来   // 假进度：慢慢逼近九成，真正好了再写满
 say=setInterval(function(){if(failed)return;wi=(wi+1)%words.length;line();},2000);
(function(){var place=function(){var w=innerWidth,h=innerHeight,pt=w<h*.9,btnH=Math.max(40,Math.min(54,h*.085)),g1=Math.max(pt?30:26,h*.045),tH,tW,cx,top;
  if(pt){tW=Math.min(w*.56,280,h*.36*984/1387);tH=tW*1387/984;cx=w/2;top=Math.max(h*.42,h-14-btnH-g1-tH);}else{tH=Math.min(h*.7,900,h-160);tW=tH*984/1387;cx=w*.77;top=Math.max(6,(h-tH-g1-btnH)/2);}
  var bs=el('bootSlot');if(!bs)return;var o=bs.style;o.left=cx+'px';o.top=(top+tH+g1+btnH)+'px';o.bottom='auto';o.transform='translate(-50%,-100%)';o.width=Math.max(200,tW*1.1)+'px';o.maxWidth='none';};   /* 11/14 用户：加载的「出征」和进度条放在首页标题+按钮那一块，和首页对齐 */
 place();addEventListener('resize',place);})();
(function(){var a=el('bootArt'),u=getComputedStyle(a).backgroundImage.replace(/^url\(["']?|["']?\)$/g,''),im=new Image();im.onload=function(){a.classList.add('on');};im.src=u;})();
function error(message){if(ready)return;failed=true;el('bootText').textContent='加载出错';el('bootRefresh').hidden=false;el('bootError').textContent=String(message||'未知错误');}
window.addEventListener('error',function(e){if(e.message)error(e.message);});
window.addEventListener('unhandledrejection',function(e){error(e.reason&&e.reason.message||e.reason);});
// 脚本跑完只算「代码好了」；等首页背景图和书法标题也下载好，title.js 再调 bootDone 揭幕（11/11 用户定：加载提示放在登录框的位置）
window.finishBoot=function(){if(failed)return;ready=true;clearTimeout(timer);};
// 11/12：「点击任意处开始」和加载结合——图好了再等主界面曲缓冲（最多 5 秒）；浏览器允许自动放音就直接揭幕，不允许就在进度条位置提示点一下，点的这一下音乐和首页一起出来
window.bootDone=function(){if(failed)return;ready=true;clearTimeout(timer);clearInterval(say);el('bootText').textContent='调弦中……';
 var t0=Date.now(),wait=setInterval(function(){var B=window.BGM_TITLE,a=B&&B.audio;if(a&&a.readyState<3&&Date.now()-t0<5000)return;clearInterval(wait);clearInterval(tick);p=1;el('bootBar').style.width='100%';el('bootBigInk').style.clipPath='inset(0 0 0 0)';
  if(B&&B.auto){reveal();return;}
  var s=el('bootSplash');el('bootText').textContent='点击任意处开始';el('bootText').className='tap';s.style.cursor='pointer';
  var go=function(e){if(e&&e.type==='keydown'&&e.key==='Escape')return;if(e){e.preventDefault();e.stopPropagation();}window.removeEventListener('keydown',go,true);s.removeEventListener('click',go);s.removeEventListener('pointerup',up);if(B&&B.start)B.start();reveal();},
   up=function(e){if(e.pointerType!=='mouse')go(e);};
  s.addEventListener('click',go);s.addEventListener('pointerup',up);window.addEventListener('keydown',go,true);},100);};
function reveal(){el('bootText').className='';el('bootText').textContent='';window.bootRevealed=true;setTimeout(function(){var s=el('bootSplash');if(!s)return;s.classList.add('out');setTimeout(function(){s.remove();},500);},250);}
if(location.protocol==='https:'&&!/[?&]debug(?:=|&|$)/.test(location.search)&&'serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
})();
// 自动更新：打开游戏、或从后台切回来时，查一下线上有没有新版本；有就在标题/整备页自动刷新（战斗中不打扰）
(function(){
var BUILD='__BUILD__',busy=false;
if(location.protocol!=='https:'||/[?&]debug(?:=|&|$)/.test(location.search))return;
function check(){
  if(busy)return;
  if(window.TITLE&&TITLE.blocks&&!TITLE.blocks())return;   // 正在战斗：不刷新
  busy=true;
  fetch('/version.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(d&&d.v&&d.v!==BUILD)return fetch('/index.html',{cache:'reload'}).then(function(){location.reload();});
  }).catch(function(){}).then(function(){busy=false;});
}
window.addEventListener('load',function(){setTimeout(check,1500);});
document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
})();
</script>
